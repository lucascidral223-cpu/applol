name: Coletar dados
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar coletor
        run: python coletor.py 3000
        env:
          RIOT_KEY: ${{ secrets.RIOT_KEY }}
      - name: Salvar data.json
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "Atualiza dados" || echo "nada novo"
          git push
