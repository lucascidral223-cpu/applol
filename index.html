<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu LoL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--s:#fff;--s2:#eaeef5;--text:#121a26;--muted:#5f6f83;--line:#dde3ec;--acc:#0f9d8a;--gold:#a97b12;--good:#13915f;--bad:#c9443c;--glow:rgba(15,157,138,.1)}
@media (prefers-color-scheme:dark){:root{--bg:#0c1320;--s:#141e2e;--s2:#1b283b;--text:#e9eff7;--muted:#8a9bb0;--line:#243349;--acc:#4fd1be;--gold:#e3b95a;--good:#4fdba0;--bad:#ff7f76;--glow:rgba(79,209,190,.12);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 "Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{font-weight:800;font-size:1.2rem;letter-spacing:-.02em}.brand i{color:var(--acc);font-style:normal}
button{font:600 14px "Inter",system-ui,sans-serif;color:var(--muted);background:none;border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed="true"]{background:var(--acc);color:#04201c}
.pill{background:var(--s);border:1px solid var(--line);color:var(--text);white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--acc);color:#04201c;border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input{font:inherit;color:var(--text);background:var(--s);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
.search{display:flex;gap:8px;margin-bottom:10px}
#grid{display:flex;flex-wrap:wrap;gap:8px;max-height:170px;overflow-y:auto;padding:12px;background:var(--s);border:1px solid var(--line);border-radius:18px;margin-bottom:20px}
#grid button{padding:0;width:50px;height:50px;border-radius:12px;overflow:hidden;opacity:.85}
#grid button:hover{opacity:1}#grid button.sel{opacity:1;outline:2px solid var(--acc);outline-offset:1px}
#grid img{width:100%;height:100%;display:block}
.card{background:var(--s);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card.bad{border-left:4px solid var(--bad)}.card.good{border-left:4px solid var(--good)}.card.acc{border-left:4px solid var(--acc)}
.card.hero{background:linear-gradient(135deg,var(--glow),transparent 70%),var(--s)}
.vs{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.vs .p{text-align:center;font-weight:800}.vs img{width:84px;height:84px;border-radius:18px;display:block;margin:0 auto 6px}
.vs .x{color:var(--muted);font-weight:800;letter-spacing:.1em}
.badge{display:inline-block;margin-top:14px;font-weight:800;border-radius:999px;padding:6px 14px;background:var(--s2)}
.badge.up{color:var(--good)}.badge.down{color:var(--bad)}.badge.even{color:var(--gold)}
.center{text-align:center}.src{color:var(--muted);font-size:14px;margin:8px 0 0}
.big{font-size:clamp(1.15rem,3.6vw,1.45rem);font-weight:600;line-height:1.4;margin:0}
ul.t{margin:0;padding:0;list-style:none}ul.t li{position:relative;padding-left:20px;margin-bottom:10px}
ul.t li::before{content:"";position:absolute;left:2px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.bad ul.t li::before{background:var(--bad)}.good ul.t li::before{background:var(--good)}
.list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:12px;padding:4px 12px 4px 4px;font-weight:600;font-size:14px}
.chip img{width:36px;height:36px;border-radius:8px}.chip.n{padding:8px 12px}
.slots{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.slot{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--s);color:var(--text);border-radius:16px;padding:8px 16px 8px 8px;text-align:left;min-width:170px}
.slot[aria-pressed="true"]{background:var(--s);color:var(--text);border-color:var(--acc)}
.slot img{width:48px;height:48px;border-radius:10px}.slot small{display:block;color:var(--muted);font-weight:400}
.hint{color:var(--muted);font-size:14px}
.tool{margin:18px 0 0;display:flex;gap:8px;flex-wrap:wrap}
.when{color:var(--muted);font-size:13px;margin:6px 0 0}
a{color:var(--acc)}
.fonts a{display:inline-block;margin:0 10px 6px 0;font-size:14px}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div class="brand">Meu <i>LoL</i></div><button class="pill" id="keyBtn">Chave Gemini</button></div>
  <div id="keyBox"></div>
  <div class="row" id="roles"></div>
  <div class="search"><input id="q" placeholder="Buscar campeão…" aria-label="Buscar campeão" autocomplete="off"><button class="pill" id="onlyTop">Só topo</button></div>
  <div id="grid"></div>
  <div id="slots"></div>
  <div id="out"></div>
</main>
<script>
const DD = "https://ddragon.leagueoflegends.com";
const MODELS = ["gemini-2.5-flash", "gemini-3-flash-preview"];
const ROLES = {TOP:"Topo", JUNGLE:"Selva", MIDDLE:"Meio", BOTTOM:"Atirador", UTILITY:"Suporte"};
const TOPS = new Set("Aatrox Ambessa Camille Chogath Darius DrMundo Fiora Galio Garen Gnar Gragas Gwen Heimerdinger Illaoi Irelia Jax Jayce Kayle Kennen Kled KSante Lissandra Malphite Maokai MonkeyKing Mordekaiser Nasus Olaf Ornn Pantheon Poppy Quinn Rammus Renekton Riven Rumble Ryze Sett Shen Singed Sion Sylas Teemo Trundle Tryndamere Udyr Urgot Vayne Vladimir Volibear Warwick Yasuo Yone Yorick Akali Akshan Cassiopeia Gangplank".split(" "));
let V, CH = {}, IT = {}, SM = {}, KEY = "", role = "TOP", me = null, foe = null, target = "me", onlyTop = true, compact = false, rid = 0, last = null;
try { KEY = localStorage.getItem("gemini-key") || ""; } catch (e) {}
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const li = a => arr(a).map(t => `<li>${esc(t)}</li>`).join("");
const chImg = id => `${DD}/cdn/${V}/img/champion/${id}.png`;

async function init() {
  try {
    V = (await (await fetch(DD + "/api/versions.json")).json())[0];
    const g = f => fetch(`${DD}/cdn/${V}/data/pt_BR/${f}.json`).then(r => r.json());
    const [c, i, s] = await Promise.all([g("champion"), g("item"), g("summoner")]);
    CH = c.data; IT = i.data; SM = s.data;
  } catch (e) { $("out").innerHTML = `<p class="hint">Não consegui carregar os dados da Riot. Verifique a conexão.</p>`; return; }
  renderAll();
  if (!KEY) renderKey(true);
}
function renderAll() { renderRoles(); renderGrid(); renderSlots(); }
function renderRoles() {
  $("roles").innerHTML = Object.entries(ROLES).map(([k, n]) => `<button class="pill" data-role="${k}" aria-pressed="${k === role}">${n}</button>`).join("");
  $("onlyTop").setAttribute("aria-pressed", onlyTop);
}
function renderGrid() {
  const t = norm($("q").value), sel = [me, foe];
  $("grid").innerHTML = Object.values(CH).filter(c => norm(c.name).includes(t) && (!onlyTop || TOPS.has(c.id)))
    .map(c => `<button data-id="${c.id}" title="${esc(c.name)}" aria-label="${esc(c.name)}" class="${sel.includes(c.id) ? "sel" : ""}"><img loading="lazy" src="${chImg(c.id)}" alt=""></button>`).join("");
}
function renderSlots() {
  const slot = (k, label, id) => `<button class="slot" data-target="${k}" aria-pressed="${target === k}">${id ? `<img src="${chImg(id)}" alt=""><span><small>${label}</small>${esc(CH[id].name)}</span>` : `<span><small>${label}</small>Escolher…</span>`}</button>`;
  $("slots").innerHTML = `<div class="slots">${slot("me", "Meu campeão", me)}<button class="pill" id="swap" aria-label="Trocar">⇄</button>${slot("foe", "Campeão inimigo", foe)}</div>`;
}
function renderKey(open) {
  if (!open) { $("keyBox").innerHTML = ""; return; }
  $("keyBox").innerHTML = `<div class="card acc"><p class="eyebrow">Chave do Gemini</p>
    <p style="margin-top:0">Para gerar as análises, cole sua chave gratuita do Google AI Studio (aistudio.google.com/apikey). Ela fica salva só neste navegador e é enviada apenas para o Google.</p>
    <input id="keyIn" type="password" placeholder="Cole a chave aqui" autocomplete="off" value="${esc(KEY)}">
    <div class="tool"><button class="pill" id="saveKey">Salvar</button>${KEY ? `<button class="pill" id="delKey">Remover chave</button>` : ""}</div></div>`;
}

/* ---------- Gemini ---------- */
function prompt() {
  const A = CH[me].name, B = CH[foe].name, patch = V.split(".").slice(0, 2).join(".");
  return `Você é um coach de League of Legends de alto nível. Analise o confronto na rota ${ROLES[role]}: ${A} (meu campeão) contra ${B} (campeão inimigo), no patch atual (${patch}).
Use a busca na web para conferir a taxa de vitória e as builds atuais deste confronto (Lolalytics, U.GG, Mobalytics, OP.GG) e diga na resposta quando não encontrar dados. Use os nomes de itens, runas e feitiços exatamente como aparecem no cliente brasileiro do LoL (pt-BR). Seja direto e prático.
Responda SOMENTE com um JSON válido, sem markdown e sem texto fora dele, neste formato:
{"veredito":"favorece_voce | favorece_inimigo | equilibrado",
"resumo_dados":"1 frase com quem leva vantagem na rota e a taxa de vitória aproximada",
"plano_de_jogo":"1 frase ultra-curta com o plano (ex.: jogue recuado até o nível 6, evite trocas longas e farme sob a torre)",
"win_condition":"2 a 3 frases: como vencer este confronto e o que fazer se estiver atrás (ex.: 0/2)",
"runas":{"principal":"árvore e runas","secundaria":"árvore e runas","porque":"1 frase"},
"feiticos":[{"nome":"Flash","motivo":"..."},{"nome":"...","motivo":"..."}],
"itens":{"iniciais":["..."],"botas":"...","core":["..."],"situacionais":[{"item":"...","quando":"..."}]},
"fase_de_rotas":["níveis 1 a 3: ...","níveis 4 a 5: ...","nível 6: ..."],
"mid_late":["split push: ...","teamfight: ...","objetivos e teleporte: ..."],
"erros_comuns":["o que NÃO fazer, 3 a 5 itens"]}`;
}
async function ask(text) {
  let lastErr = new Error("Modelo indisponível.");
  for (const model of MODELS) for (const search of [true, false]) {
    const body = { contents: [{ parts: [{ text }] }], generationConfig: { temperature: 0.4 } };
    if (search) body.tools = [{ google_search: {} }];
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
      method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": KEY }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) return { j, search };
    lastErr = Object.assign(new Error((j.error && j.error.message) || "Erro"), { status: r.status });
    if (![404, 429, 500, 503].includes(r.status)) throw lastErr;
  }
  throw lastErr;
}
function parse(j) {
  const c = j.candidates && j.candidates[0], t = ((c && c.content && c.content.parts) || []).map(p => p.text || "").join("");
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b < a) throw new Error("A resposta não veio no formato esperado. Tente atualizar.");
  const o = JSON.parse(t.slice(a, b + 1));
  const ch = (c && c.groundingMetadata && c.groundingMetadata.groundingChunks) || [];
  const src = [...new Map(ch.filter(x => x.web && /^https:\/\//.test(x.web.uri || "")).map(x => [x.web.uri, { u: x.web.uri, t: x.web.title || "fonte" }])).values()].slice(0, 6);
  return { o, src };
}
function errMsg(e) {
  if (e.status === 400 || e.status === 403) return "A chave do Gemini foi recusada. Confira se copiou a chave inteira em “Chave Gemini”.";
  if (e.status === 429) return "O limite gratuito do Gemini foi atingido. Espere um ou dois minutos e tente de novo. Detalhe do Google: " + (e.message || "").slice(0, 240);
  if (e.status >= 500) return "O Gemini está sobrecarregado agora. Tente de novo em instantes.";
  return e.message || "Algo deu errado.";
}
async function run(force) {
  if (!me || !foe) return;
  if (!KEY) { renderKey(true); $("out").innerHTML = ""; return; }
  const key = `lol:${role}:${me}:${foe}`, id = ++rid;
  let c = null; try { c = JSON.parse(localStorage.getItem(key)); } catch (e) {}
  if (c && !force) { last = c; show(); return; }
  $("out").innerHTML = `<div class="card center"><p class="big">Gerando a análise…</p><p class="hint">Consultando o Gemini e a web. Leva de 10 a 40 segundos.</p></div>`;
  try {
    const got = await ask(prompt()), { o, src } = parse(got.j);
    if (id !== rid) return;
    last = { o, src, t: Date.now(), ns: !got.search };
    try { localStorage.setItem(key, JSON.stringify(last)); } catch (e) {}
    show();
  } catch (e) {
    if (id !== rid) return;
    $("out").innerHTML = `<div class="card bad"><p style="margin:0 0 12px">${esc(errMsg(e))}</p><button class="pill" id="retry">Tentar de novo</button></div>`;
  }
}

/* ---------- Resultado ---------- */
function itemChip(name) {
  const n = norm(name), hit = Object.entries(IT).find(([, it]) => norm(it.name) === n) || Object.entries(IT).find(([, it]) => n.length > 5 && (norm(it.name).includes(n) || n.includes(norm(it.name))));
  return hit ? `<div class="chip"><img src="${DD}/cdn/${V}/img/item/${hit[0]}.png" alt="">${esc(hit[1].name)}</div>` : `<div class="chip n">${esc(name)}</div>`;
}
function spellChip(name) {
  const n = norm(name), hit = Object.values(SM).find(s => norm(s.name) === n);
  return hit ? `<div class="chip"><img src="${DD}/cdn/${V}/img/spell/${hit.image.full}" alt="">${esc(hit.name)}</div>` : `<div class="chip n">${esc(name)}</div>`;
}
function show() {
  const { o, src, t } = last, A = CH[me], B = CH[foe];
  const side = { favorece_voce: ["up", "Você ganha a rota"], favorece_inimigo: ["down", "O inimigo ganha a rota"] }[o.veredito] || ["even", "Rota equilibrada"];
  const it = o.itens || {}, ru = o.runas || {};
  let h = `<div class="tool"><button class="pill" id="compact" aria-pressed="${compact}">Modo resumo</button><button class="pill" id="refresh">Atualizar análise</button></div>
  <div class="card hero center"><div class="vs"><div class="p"><img src="${chImg(me)}" alt="">${esc(A.name)}</div><div class="x">VS</div><div class="p"><img src="${chImg(foe)}" alt="">${esc(B.name)}</div></div>
  <span class="badge ${side[0]}">${side[1]}</span><p class="src">${esc(o.resumo_dados)}</p></div>
  <div class="card acc"><p class="eyebrow">Plano de jogo</p><p class="big">${esc(o.plano_de_jogo)}</p></div>
  <div class="card good"><p class="eyebrow">Win condition</p><p style="margin:0">${esc(o.win_condition)}</p></div>`;
  if (!compact) {
    h += `<div class="card"><p class="eyebrow">Fase de rotas</p><ul class="t">${li(o.fase_de_rotas)}</ul></div>
    <div class="card"><p class="eyebrow">Runas</p><p style="margin:0 0 6px"><b>Principal:</b> ${esc(ru.principal)}</p><p style="margin:0 0 6px"><b>Secundária:</b> ${esc(ru.secundaria)}</p><p class="hint" style="margin:0">${esc(ru.porque)}</p></div>
    <div class="card"><p class="eyebrow">Feitiços de invocador</p>${arr(o.feiticos).map(f => `<div style="margin-bottom:12px"><div class="list">${spellChip(f.nome)}</div><span>${esc(f.motivo)}</span></div>`).join("")}</div>
    <div class="card"><p class="eyebrow">Build</p>
      ${arr(it.iniciais).length ? `<p class="hint" style="margin:0 0 6px">Itens iniciais</p><div class="list">${arr(it.iniciais).map(itemChip).join("")}</div>` : ""}
      ${it.botas ? `<p class="hint" style="margin:8px 0 6px">Botas</p><div class="list">${itemChip(it.botas)}</div>` : ""}
      ${arr(it.core).length ? `<p class="hint" style="margin:8px 0 6px">Itens principais</p><div class="list">${arr(it.core).map(itemChip).join("")}</div>` : ""}
      ${arr(it.situacionais).length ? `<p class="hint" style="margin:8px 0 6px">Situacionais</p>${arr(it.situacionais).map(s => `<div style="margin-bottom:10px"><div class="list" style="margin-bottom:4px">${itemChip(s.item)}</div><span>${esc(s.quando)}</span></div>`).join("")}` : ""}</div>
    <div class="card"><p class="eyebrow">Mid e late game</p><ul class="t">${li(o.mid_late)}</ul></div>
    <div class="card bad"><p class="eyebrow">Erros comuns: o que NÃO fazer</p><ul class="t">${li(o.erros_comuns)}</ul></div>
    ${src.length ? `<div class="card fonts"><p class="eyebrow">Fontes consultadas pelo Gemini</p>${src.map(s => `<a href="${esc(s.u)}" target="_blank" rel="noopener noreferrer">${esc(s.t)}</a>`).join("")}</div>` : ""}`;
  }
  h += `<p class="when">Gerado pelo Gemini em ${new Date(t).toLocaleString("pt-BR")}.${last.ns ? " Esta análise foi feita sem busca na web (limite atingido), então os números podem estar desatualizados." : ""} A IA pode errar: confira os números nas fontes antes de decidir.</p>`;
  $("out").innerHTML = h;
}

/* ---------- Eventos ---------- */
$("q").oninput = renderGrid;
$("onlyTop").onclick = () => { onlyTop = !onlyTop; renderRoles(); renderGrid(); };
$("keyBtn").onclick = () => renderKey(!$("keyBox").innerHTML);
$("roles").onclick = e => { const b = e.target.closest("[data-role]"); if (!b) return; role = b.dataset.role; renderRoles(); run(false); };
$("grid").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (target === "me") { me = b.dataset.id; target = "foe"; } else { foe = b.dataset.id; }
  renderGrid(); renderSlots(); run(false);
};
$("slots").onclick = e => {
  const t = e.target.closest("[data-target],#swap"); if (!t) return;
  if (t.id === "swap") { [me, foe] = [foe, me]; run(false); } else target = t.dataset.target;
  renderGrid(); renderSlots();
};
$("keyBox").onclick = e => {
  if (e.target.id === "saveKey") { KEY = $("keyIn").value.trim(); try { localStorage.setItem("gemini-key", KEY); } catch (x) {} renderKey(false); run(false); }
  if (e.target.id === "delKey") { KEY = ""; try { localStorage.removeItem("gemini-key"); } catch (x) {} renderKey(true); }
};
$("out").onclick = e => {
  if (e.target.id === "compact") { compact = !compact; show(); }
  if (e.target.id === "refresh") run(true);
  if (e.target.id === "retry") run(false);
};
init();
</script>
</body>
</html>
